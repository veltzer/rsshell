# cargo-deny configuration: `cargo deny check` runs in CI and in
# `rsconstruct build` (processor.clippy.deny). cargo-deny has no permissive
# default: without this file every license is rejected and every advisory
# class is an error.

[graph]
all-features = true

# Every RustSec advisory in the locked closure fails the build: a
# vulnerability needs `cargo update`, an unmaintained crate needs a
# maintained replacement. Nothing is ignored here; an ignore entry must
# carry the advisory id and the reason it cannot be fixed yet.
[advisories]
ignore = [
    # clap 2 (with ansi_term and atty) is a build dependency of bindgen 0.59,
    # which fluidlite-sys pins. Build-time only, rsear only. Drop when
    # fluidlite-sys moves to a current bindgen.
    { id = "RUSTSEC-2026-0542", reason = "humantime via env_logger 0.9 via bindgen 0.59, a build dependency pinned by fluidlite-sys" },
    # chrono, chrono-tz and chrono-tz-build were declared unmaintained
    # together (chronotope/chrono#1768); no version is unaffected. tera 1.20
    # pulls all three in through its `builtins` feature, which also gates
    # every other built-in filter and function, so it cannot be switched off
    # on its own (rsconstruct, rspass, rssite); other repos reach chrono
    # through their own upstreams. Direct uses should move to jiff or time;
    # drop these entries when tera ships a release without chrono and no
    # repo's lockfile holds it any more.
    { id = "RUSTSEC-2026-0543", reason = "chrono, pinned by tera's builtins feature and other upstreams; no release without it" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz via tera's builtins feature; no tera release without it" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build, the build script of chrono-tz, via tera's builtins feature" },
]

# Only these licenses may appear in the dependency graph. All are
# permissive; a crate offering a choice (`MIT OR Apache-2.0`) passes when any
# alternative is listed, which is why r-efi's LGPL option needs no entry.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    # Font licences: egui embeds its default fonts (epaint_default_fonts),
    # which carry OFL-1.1 and Ubuntu-font-1.0 alongside MIT OR Apache-2.0.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# fluidlite and fluidlite-sys (rsear's synthesiser) are LGPL-2.1: a
# deliberate, crate-scoped exception rather than a fleet-wide allowance of
# LGPL. Their manifests use the deprecated bare "LGPL-2.1" identifier, hence
# the clarifications.
[[licenses.clarify]]
name = "fluidlite"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
name = "fluidlite-sys"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.exceptions]]
name = "fluidlite"
allow = ["LGPL-2.1-only"]

[[licenses.exceptions]]
name = "fluidlite-sys"
allow = ["LGPL-2.1-only"]

# libfuzzer-sys (NCSA, a permissive BSD-style licence) is a dependency of
# rav1e, rssite's AVIF encoder, only under cfg(fuzzing): it is never built,
# but cargo-deny reads every cfg. Scoped to the crate, like fluidlite's.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
